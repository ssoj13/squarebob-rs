name: Setup native dependencies
description: Install platform system and packaging dependencies.

inputs:
  platform:
    description: linux, windows, or macos
    required: true
  packaging:
    description: Install packaging tools in addition to build dependencies
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: ${{ inputs.platform == 'linux' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          libasound2-dev \
          libgl1-mesa-dev \
          libgtk-3-dev \
          libwayland-dev \
          libx11-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcursor-dev \
          libxi-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libxrandr-dev \
          autoconf \
          automake \
          libtool \
          nasm \
          yasm \
          pkg-config
        if [ "${{ inputs.packaging }}" = "true" ]; then
          sudo apt-get install -y dpkg-dev fakeroot
        fi

    - name: Install macOS build tools
      if: ${{ inputs.platform == 'macos' }}
      shell: bash
      run: brew install autoconf automake libtool nasm pkg-config yasm

    - name: Install Windows packaging dependencies
      if: ${{ inputs.platform == 'windows' && inputs.packaging == 'true' }}
      shell: pwsh
      run: choco install nsis -y --no-progress
