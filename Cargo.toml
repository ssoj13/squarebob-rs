[package]
name = "squarebob-rs"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true

# Produced binary is `squarebob.exe` / `squarebob` rather than the
# crate-default `squarebob-rs`. The package name stays as `squarebob-rs`
# because automation and ProjectDirs identifiers treat it as crate identity;
# renaming would invalidate user-side cache/preset directories.
[[bin]]
name = "squarebob"
path = "src/main.rs"

[workspace]
members = [
    "crates/squarebob-core",
    "crates/pt-core",
    "crates/bvh-gpu",
    "crates/pt-megakernel",
    "crates/pt-wavefront",
    "crates/pt-mats",
    "crates/render-core",
    "crates/render-shared",
    "crates/render-3d",
    "crates/media-encoder",
    "crates/xtask",
    "crates/treemap",
    "crates/pt-denoise-oidn",
    "crates/gpu-mem",
    "crates/standard-surface",
    "crates/squarebob-widgets",
    "crates/pt-material",
    "crates/playa-ae",
    "crates/egui-colorpicker",
    "crates/color-pipeline",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
# Error handling / logging
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode 3.0.0 intentionally fails compilation; keep the latest usable 1.x cache codec.
bincode = "=1.3.3"

# Math / GPU data
glam = "0.33"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.7"
uuid = { version = "1", features = ["v4", "serde"] }

# GPU / rendering
wgpu = "30"
pollster = "1.0"

# UI (egui ecosystem)
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui-wgpu = "0.36"
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui-phosphor = "0.14"

# OIDN denoiser Burn stack — GIT deps (a [patch] can't cross 0.21->0.22). Same revs
# oidn-rs/render-rs/gsplat-rs pin. pt-denoise-oidn uses burn's wgpu backend +
# `try_into_primitive`, so burn carries wgpu+extension. Keep every burn-wgpu edge
# default-features=false so `fusion` stays OFF (the `try_into_primitive::<Wgpu>()`
# -> CubeTensor downcast requires it). Consolidated here (was raw pins in
# pt-denoise-oidn) so a future bump touches only this block. See
# colmap-rs/docs/egui-wgpu-bump.md.
burn = { git = "https://github.com/tracel-ai/burn", rev = "93e63e8e9cf215ffb870ed62132961588a774096", default-features = false, features = ["std", "ndarray", "wgpu", "extension"] }
burn-wgpu = { git = "https://github.com/tracel-ai/burn", rev = "93e63e8e9cf215ffb870ed62132961588a774096", default-features = false }
cubecl-wgpu = { git = "https://github.com/tracel-ai/cubecl", rev = "31c5506cfc1dd9d350124910fb51cee8b54a31e1" }

# Imaging
image = "0.25"

# Concurrency / FS scan
rayon = "1.12"
crossbeam-channel = "0.5"

# System / OS / UX
sysinfo = "0.39"
directories = "6"
rfd = "0.17"
open = "5"
trash = "5"
sha2 = "0.11"

# Auto allocator (mimalloc-based)
auto-allocator = { version = "*", features = ["secure"] }

# Platform
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Foundation",
    "Win32_Security",
] }
libc = "0.2"

# External git deps
#
# ffmpeg-rs on `branch = "main"`, like every other cross-repo dep here. The old
# `rev = "c0a8e10b…"` pin had stopped existing: ffmpeg-rs rewrote its history, so
# that commit is on no branch and is not an ancestor of main. GitHub will not
# serve an unreachable SHA, so the pin failed with "upload-pack: not our ref" for
# anyone resolving from a clean state — it only kept working here because a stale
# object sat in the local cargo git db.
av-codec = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main", features = ["enc-hevc", "enc-av1"] }
av-codec-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-format = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-swscale = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-frame = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-pixfmt = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
openh264 = { version = "=0.9.8", features = ["source"] }
vfx-core = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main" }
vfx-io = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main", default-features = false, features = ["exr", "htj2k", "png", "jpeg", "tiff", "dpx", "hdr"] }
# Full OCIO-compatible colour management. Replaces the hand-rolled
# ACES Idt/Lmt/Rrt/Odt enums + matrix bake on the CPU side with a
# proper `Config` / `Processor` / `Look` model, plus LUT loading
# (`.cube` / `.3dl` / `.spi1d` / `.spi3d` / `.csp`) and GPU shader
# generation. Bundles a built-in ACES 1.3 config so the app works
# without any external `.ocio` file.
vfx-ocio = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main" }
# LUT baker / loader counterpart — same crate family, separate
# split so callers can pull just LUT IO without dragging the whole
# OCIO config machinery.
vfx-lut = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main" }

# Internal crate paths
squarebob-core = { path = "crates/squarebob-core" }
render-core = { path = "crates/render-core" }
render-shared = { path = "crates/render-shared" }
render-3d = { path = "crates/render-3d" }
treemap = { path = "crates/treemap" }
pt-core = { path = "crates/pt-core" }
pt-mats = { path = "crates/pt-mats" }
pt-material = { path = "crates/pt-material" }
pt-megakernel = { path = "crates/pt-megakernel" }
pt-wavefront = { path = "crates/pt-wavefront" }
pt-denoise-oidn = { path = "crates/pt-denoise-oidn" }
bvh-gpu = { path = "crates/bvh-gpu" }
gpu-mem = { path = "crates/gpu-mem" }
media-encoder = { path = "crates/media-encoder" }
standard-surface = { path = "crates/standard-surface" }
squarebob-widgets = { path = "crates/squarebob-widgets" }
playa-ae = { path = "crates/playa-ae" }
egui-colorpicker = { path = "crates/egui-colorpicker" }
color-pipeline = { path = "crates/color-pipeline" }

[dependencies]
# https://dev.to/yeauty/double-your-performance-with-one-line-of-code-the-memory-superpower-every-rust-developer-should-1g93
auto-allocator = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "persistence", "wgpu", "x11", "wayland"] }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui_dock = { workspace = true }
fscan-rs = { git = "ssh://git@github.com/ssoj13/fscan-rs.git", rev = "c33d4474b5004ec047ecd065f96f6a53addbc97e" }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rfd = { workspace = true }
open = { workspace = true }
trash = { workspace = true }
bincode = { workspace = true }
directories = { workspace = true }
sha2 = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
half = { workspace = true }
squarebob-core = { workspace = true }
render-core = { workspace = true }
render-shared = { workspace = true }
render-3d = { workspace = true }
media-encoder = { workspace = true }
treemap = { workspace = true, features = ["wgpu"] }
pt-core = { workspace = true }
bvh-gpu = { workspace = true }
pt-megakernel = { workspace = true }
pt-wavefront = { workspace = true }
pt-mats = { workspace = true }
pt-material = { workspace = true }
squarebob-widgets = { workspace = true }
playa-ae = { workspace = true }
egui-colorpicker = { workspace = true }
color-pipeline = { workspace = true }
uuid = { workspace = true }
pt-denoise-oidn = { workspace = true }
sysinfo = { workspace = true }
egui-phosphor = { workspace = true }
gpu-mem = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3

[package.metadata.packager]
product-name = "Squarebob"
identifier = "io.github.ssoj13.squarebobrs"
description = "Cross-platform disk usage visualizer with 2D and 3D treemap rendering."
homepage = "https://github.com/ssoj13/squarebob-rs"
out-dir = "dist"
binaries-dir = "target/release"
resources = [{ src = "data", target = "data" }]

[package.metadata.packager.deb]
depends = [
    "libasound2",
    "libgtk-3-0",
    "libx11-6",
    "libxcb-render0",
    "libxcb-shape0",
    "libxcb-xfixes0",
    "libxkbcommon0",
]
section = "utils"
priority = "optional"

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
