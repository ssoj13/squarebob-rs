[package]
name = "squarebob-rs"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true

# Produced binary is `squarebob.exe` / `squarebob` rather than the
# crate-default `squarebob-rs`. The package name stays as `squarebob-rs`
# because automation and ProjectDirs identifiers treat it as crate identity;
# renaming would invalidate user-side cache/preset directories.
[[bin]]
name = "squarebob"
path = "src/main.rs"

[workspace]
members = [
    "crates/squarebob-core",
    "crates/render-core",
    "crates/render-shared",
    "crates/render-3d",
    "crates/media-encoder",
    "crates/xtask",
    "crates/treemap",
    "crates/squarebob-widgets",
    "crates/playa-ae",
    "crates/egui-colorpicker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
# Error handling / logging
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode 3.0.0 intentionally fails compilation; keep the latest usable 1.x cache codec.
bincode = "=1.3.3"

# Math / GPU data
glam = "0.33"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.7"
uuid = { version = "1", features = ["v4", "serde"] }

# GPU / rendering
wgpu = "30"
pollster = "1.0"

# UI (egui ecosystem)
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui-wgpu = "0.36"
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
# Shared phosphor icon vocabulary (`icons::*`) + `add_icon_font`, from the same egui-widgets-rs as egui-display.
soluwell-config = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
soluwell-viewport = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
# Display-referred PNG / PNG-sequence video export + transfer maths (moved out of egui-display).
# `export` = PNG files, output-view choice, video options; media-encoder's `video` adds `cli`.
video-io = { git = "ssh://git@github.com/ssoj13/video-io-rs.git", branch = "main", default-features = false, features = ["export"] }

# The OIDN denoiser is render-rs `pt-denoise-oidn` (the one implementation; squarebob's copy was removed): it brings
# its burn / cubecl stack and the process's one burn device (`burn-device::shared`). `embed-all` keeps every Intel
# weight variant baked in, as squarebob shipped before.
pt-denoise-oidn = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main", features = ["embed-all"] }

# Imaging. `image` formats come from exr-image (image's default set minus `exr`); EXR is decoded by
# exr-core through exr-image's hooks, never by crates.io `exr`.
image = { version = "0.25", default-features = false }
exr-image = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }
exr-core = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }
imath-rs = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }

# Concurrency / FS scan
rayon = "1.12"
crossbeam-channel = "0.5"

# System / OS / UX
sysinfo = "0.39"
directories = "6"
rfd = "0.17"
open = "5"
trash = "5"
sha2 = "0.11"

# Auto allocator (mimalloc-based)
auto-allocator = { version = "*", features = ["secure"] }

# Platform
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Foundation",
    "Win32_Security",
] }
libc = "0.2"

#Display-referred PNG / PNG-sequence video export + native ffmpeg-rs encoder (`video-io`).
av-util-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
vfx-core = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main" }
vfx-io = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main", default-features = false, features = ["exr", "htj2k", "png", "jpeg", "tiff", "dpx", "hdr"] }
# Display colour management: the cglibs' one OCIO policy crate (config / input / display / view /
# look / custom LUT, built-in tonemaps, window-canvas adaptation) and its GPU side, which compiles
# the processor to vfx-ocio's exact WGSL (`OcioShader`) for the path-tracer blit. Shared with
# rv-rs / vfx-view / playa / colmap / watermark; squarebob's own copy (`crates/color-pipeline`) was
# removed 2026-10-23.
render-color = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
render-color-gpu = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
# LUT baker / loader counterpart — same crate family, separate
# split so callers can pull just LUT IO without dragging the whole
# OCIO config machinery.
vfx-lut = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main" }

# Internal crate paths and shared cglibs crates (render-rs + gpu-info-rs)
squarebob-core = { path = "crates/squarebob-core" }
render-core = { path = "crates/render-core" }
render-shared = { path = "crates/render-shared" }
render-3d = { path = "crates/render-3d" }
treemap = { path = "crates/treemap" }
pt-core = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
pt-mats = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
pt-material = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
pt-megakernel = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
pt-cuda = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
bvh-gpu = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
gpu-mem = { package = "gpu-info-rs", git = "ssh://git@github.com/ssoj13/gpu-info-rs.git", branch = "main", features = ["wgpu"] }
media-encoder = { path = "crates/media-encoder" }
standard-surface = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main" }
squarebob-widgets = { path = "crates/squarebob-widgets" }
playa-ae = { path = "crates/playa-ae" }
egui-colorpicker = { path = "crates/egui-colorpicker" }
crashdump = { package = "crashdump-rs", git = "ssh://git@github.com/ssoj13/crashdump-rs.git", branch = "main" }
appbus = { package = "appbus-rs", git = "ssh://git@github.com/ssoj13/appbus-rs.git", branch = "main", default-features = false, features = ["bus"] }

[dependencies]
av-util-core = { workspace = true }
soluwell-viewport = { workspace = true }
# https://dev.to/yeauty/double-your-performance-with-one-line-of-code-the-memory-superpower-every-rust-developer-should-1g93
auto-allocator = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "persistence", "wgpu", "x11", "wayland"] }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { version = "0.36", features = ["serde", "accesskit"] }
winit = "0.30"
ron = "0.12"
video-io = { workspace = true }
egui_dock = { workspace = true }
fscan-rs = { git = "ssh://git@github.com/ssoj13/fscan-rs.git", rev = "94dd173e1222d89356eab5c02b84815d9c04359f" }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rfd = { workspace = true }
open = { workspace = true }
trash = { workspace = true }
bincode = { workspace = true }
directories = { workspace = true }
sha2 = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
half = { workspace = true }
squarebob-core = { workspace = true }
render-core = { workspace = true }
render-shared = { workspace = true }
render-3d = { workspace = true }
media-encoder = { workspace = true }
treemap = { workspace = true, features = ["wgpu"] }
pt-core = { workspace = true }
bvh-gpu = { workspace = true }
pt-megakernel = { workspace = true }
pt-mats = { workspace = true }
pt-material = { workspace = true }
squarebob-widgets = { workspace = true }
playa-ae = { workspace = true }
egui-colorpicker = { workspace = true }
render-color = { workspace = true }
uuid = { workspace = true }
pt-denoise-oidn = { workspace = true }
sysinfo = { workspace = true }
soluwell-config = { workspace = true }
gpu-mem = { workspace = true }
crashdump = { workspace = true }
appbus = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `display_blit_probe` compiles the OCIO canvas processor for the blit, as render-3d does.
render-color-gpu = { workspace = true }

[features]
default = []
cuda = ["render-3d/cuda"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3

[package.metadata.packager]
product-name = "Squarebob"
identifier = "io.github.ssoj13.squarebobrs"
description = "Cross-platform disk usage visualizer with 2D and 3D treemap rendering."
homepage = "https://github.com/ssoj13/squarebob-rs"
out-dir = "dist"
binaries-dir = "target/release"
resources = [{ src = "data", target = "data" }]

[package.metadata.packager.deb]
depends = [
    "libasound2",
    "libgtk-3-0",
    "libx11-6",
    "libxcb-render0",
    "libxcb-shape0",
    "libxcb-xfixes0",
    "libxkbcommon0",
]
section = "utils"
priority = "optional"

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
