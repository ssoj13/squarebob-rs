[package]
name = "squarebob-rs"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true

# Produced binary is `squarebob.exe` / `squarebob` rather than the
# crate-default `squarebob-rs`. The package name stays as `squarebob-rs`
# because dozens of references (xtask, bootstrap.py, CI, vcpkg.json,
# ProjectDirs identifiers) treat it as crate identity and renaming
# would invalidate user-side cache/preset directories.
[[bin]]
name = "squarebob"
path = "src/main.rs"

[workspace]
members = [
    "crates/squarebob-core",
    "crates/pt-core",
    "crates/bvh-gpu",
    "crates/pt-megakernel",
    "crates/pt-wavefront",
    "crates/pt-mats",
    "crates/render-core",
    "crates/render-shared",
    "crates/render-3d",
    "crates/media-encoder",
    "crates/xtask",
    "crates/treemap",
    "crates/pt-denoise-oidn",
    "crates/gpu-mem",
    "crates/standard-surface",
    "crates/squarebob-widgets",
    "crates/pt-material",
    "crates/playa-ae",
    "crates/egui-colorpicker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
# Error handling / logging
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Math / GPU data
glam = "0.32"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.7"
uuid = { version = "1", features = ["v4", "serde"] }

# GPU / rendering
wgpu = "29"
pollster = "0.4"

# UI (egui ecosystem)
eframe = { version = "0.34", default-features = false }
egui = "0.34"
egui-wgpu = "0.34"
egui_extras = "0.34"
egui_dock = { version = "0.19", features = ["serde"] }
egui-phosphor = "0.12.0"

# Imaging
image = "0.25"

# Concurrency / FS scan
rayon = "1.12"
crossbeam-channel = "0.5"
jwalk = "0.8"
num_cpus = "1"

# System / OS / UX
sysinfo = "0.38"
directories = "6"
rfd = "0.17"
open = "5"
trash = "5"
sha2 = "0.11"

# Auto allocator (mimalloc-based)
auto-allocator = { version = "*", features = ["secure"] }

# Platform
windows = { version = "0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Foundation",
    "Win32_Security",
] }
libc = "0.2"

# External git deps
playa-ffmpeg = { git = "https://github.com/ssoj13/playa-ffmpeg", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling", "nvenc", "static"] }
vfx-core = { git = "https://github.com/ssoj13/vfx-rs.git", branch = "main" }
vfx-exr = { git = "https://github.com/ssoj13/vfx-rs.git", branch = "main", features = ["htj2k"] }
vfx-io = { git = "https://github.com/ssoj13/vfx-rs.git", branch = "main", default-features = false, features = ["exr", "htj2k", "png", "jpeg", "tiff", "dpx", "hdr"] }

# Internal crate paths
squarebob-core = { path = "crates/squarebob-core" }
render-core = { path = "crates/render-core" }
render-shared = { path = "crates/render-shared" }
render-3d = { path = "crates/render-3d" }
treemap = { path = "crates/treemap" }
pt-core = { path = "crates/pt-core" }
pt-mats = { path = "crates/pt-mats" }
pt-material = { path = "crates/pt-material" }
pt-megakernel = { path = "crates/pt-megakernel" }
pt-wavefront = { path = "crates/pt-wavefront" }
pt-denoise-oidn = { path = "crates/pt-denoise-oidn" }
bvh-gpu = { path = "crates/bvh-gpu" }
gpu-mem = { path = "crates/gpu-mem" }
media-encoder = { path = "crates/media-encoder" }
standard-surface = { path = "crates/standard-surface" }
squarebob-widgets = { path = "crates/squarebob-widgets" }
playa-ae = { path = "crates/playa-ae" }
egui-colorpicker = { path = "crates/egui-colorpicker" }

[dependencies]
# https://dev.to/yeauty/double-your-performance-with-one-line-of-code-the-memory-superpower-every-rust-developer-should-1g93
auto-allocator = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "persistence", "wgpu", "x11", "wayland"] }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui_dock = { workspace = true }
jwalk = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
num_cpus = { workspace = true }
rfd = { workspace = true }
open = { workspace = true }
trash = { workspace = true }
bincode = { workspace = true }
directories = { workspace = true }
sha2 = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
half = { workspace = true }
squarebob-core = { workspace = true }
render-core = { workspace = true }
render-shared = { workspace = true }
render-3d = { workspace = true }
media-encoder = { workspace = true }
treemap = { workspace = true, features = ["wgpu"] }
pt-core = { workspace = true }
bvh-gpu = { workspace = true }
pt-megakernel = { workspace = true }
pt-wavefront = { workspace = true }
pt-mats = { workspace = true }
pt-material = { workspace = true }
squarebob-widgets = { workspace = true }
playa-ae = { workspace = true }
egui-colorpicker = { workspace = true }
uuid = { workspace = true }
pt-denoise-oidn = { workspace = true }
sysinfo = { workspace = true }
egui-phosphor = { workspace = true }
gpu-mem = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[profile.release]
opt-level = 3

[package.metadata.packager]
product-name = "Squarebob"
identifier = "io.github.ssoj13.squarebobrs"
description = "Cross-platform disk usage visualizer with 2D and 3D treemap rendering."
homepage = "https://github.com/ssoj13/squarebob-rs"
out-dir = "dist"
binaries-dir = "target/release"
resources = [{ src = "data", target = "data" }]

[package.metadata.packager.deb]
depends = [
    "libasound2",
    "libgtk-3-0",
    "libx11-6",
    "libxcb-render0",
    "libxcb-shape0",
    "libxcb-xfixes0",
    "libxkbcommon0",
]
section = "utils"
priority = "optional"

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[package.metadata.packager.nsis]
installer-mode = "currentUser"
