[package]
name = "media-encoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["video", "exr"]
video = ["video-io/cli", "video-io/native"]
exr = ["dep:vfx-core", "dep:vfx-io"]

[dependencies]
bytemuck = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
video-io = { workspace = true }
egui-widgets-config = { workspace = true }
egui_dock = { workspace = true }
half = { workspace = true, features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "tga", "hdr"] }
tiff = "0.11.3"
log = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
vfx-core = { workspace = true, optional = true }
vfx-io = { workspace = true, optional = true }
