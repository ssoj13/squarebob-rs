[package]
name = "media-encoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["ffmpeg", "exr"]
ffmpeg = ["dep:playa-ffmpeg"]
exr = ["dep:vfx-core", "dep:vfx-io"]

[dependencies]
bytemuck = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui-phosphor = { workspace = true }
egui_dock = { workspace = true }
half = { workspace = true, features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "tga", "hdr"] }
log = { workspace = true }
playa-ffmpeg = { workspace = true, optional = true }
rfd = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
vfx-core = { workspace = true, optional = true }
vfx-io = { workspace = true, optional = true }
