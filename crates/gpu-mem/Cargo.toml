[package]
name = "gpu-mem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Query GPU video memory (VRAM) and surface allocation visibility."
keywords = ["gpu", "vram", "memory", "graphics"]
categories = ["hardware-support", "os"]

# `log` is a facade crate (no transitive deps) — needed by
# `note_alloc` so consumers get level-tagged VRAM allocation
# warnings through the same logger they already use.
[dependencies]
log = { workspace = true }

# Windows uses DXGI's `IDXGIAdapter3::QueryVideoMemoryInfo` for
# instant in-process VRAM stats. Without it Windows falls back to
# spawning `nvidia-smi` per query (50–200 ms of UI-thread stall) —
# DXGI is microseconds.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
