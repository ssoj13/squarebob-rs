[package]
name = "pt-denoise-oidn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Intel OIDN GPU denoiser integration for squarebob-rs PT output."

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
half = { workspace = true }
render-core = { workspace = true }

# Burn 0.22 + WGPU backend share the same wgpu 30 pinned in the workspace root.
# `cubecl-wgpu::init_device` lets us reuse squarebob's wgpu::Instance/Adapter/
# Device/Queue, so every Burn dispatch runs on the same GPU context as PT. burn's
# wgpu+extension features (for `try_into_primitive`) are set on the root workspace
# dep; keep every burn-wgpu edge default-features=false so `fusion` stays OFF.
burn = { workspace = true }
burn-wgpu = { workspace = true }
cubecl-wgpu = { workspace = true }

# Our fork of Intel OIDN (pure Rust, weights ship as plain git blobs).
#
# `embed-all` bakes the full 23 TZA blobs (~48 MB) into the binary via
# `include_bytes!` inside oidn-rs. The OIDN denoiser runs standalone:
# `data/oidn-weights/` becomes optional and serves only as a runtime
# override (env `OIDN_WEIGHTS_DIR` or co-installed dir). Today's UI
# only reaches the HDR subset, but `embed-all` keeps every Intel
# variant (LDR, AOV-only, clean_aux, lightmap) baked in so the
# renderer can grow new pipelines without an oidn-rs rebuild.
# Disable with `default-features = false` if shipping external
# weights instead.
#
# Local sibling checkout while developing squarebob and oidn-rs together.
# Before publishing, commit/push oidn-rs and switch this back to a pinned git rev.
oidn-rs = { path = "../../../oidn-rs/crates/oidn-rs", features = ["embed-all"] }
